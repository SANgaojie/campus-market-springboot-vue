server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: campus-market-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://localhost:3306/campus_market?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME:campus_app}
    password: ${DB_PASSWORD:campus_dev_password}
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  servlet:
    multipart:
      max-file-size: ${APP_UPLOAD_MAX_FILE_SIZE:5MB}
      max-request-size: ${APP_UPLOAD_MAX_REQUEST_SIZE:20MB}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174}
  admin:
    username: ${APP_ADMIN_USERNAME:admin}
    password: ${APP_ADMIN_PASSWORD:admin123456}
    nickname: ${APP_ADMIN_NICKNAME:系统管理员}
  jwt:
    issuer: ${APP_JWT_ISSUER:campus-market}
    secret: ${APP_JWT_SECRET:change-me-to-a-long-random-secret-for-production}
    expiration-minutes: ${APP_JWT_EXPIRATION_MINUTES:120}
  storage:
    upload-dir: ${APP_UPLOAD_DIR:./uploads}
    public-path: ${APP_UPLOAD_PUBLIC_PATH:/uploads}
