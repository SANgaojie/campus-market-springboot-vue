# Campus Market 容器编排配置
#
# @author 阿德
# @date 2026/05/19
services:
  mysql:
    image: mysql:8.4
    container_name: campus-market-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root123456
      MYSQL_DATABASE: campus_market
      MYSQL_USER: campus_app
      MYSQL_PASSWORD: campus_dev_password
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -proot123456 --silent"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    container_name: campus-market-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./apps/backend
    container_name: campus-market-backend
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_URL: jdbc:mysql://mysql:3306/campus_market?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
      DB_USERNAME: campus_app
      DB_PASSWORD: campus_dev_password
      REDIS_HOST: redis
      REDIS_PORT: 6379
      APP_CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:5174,http://127.0.0.1:5173,http://127.0.0.1:5174
      APP_UPLOAD_DIR: /app/uploads
      APP_UPLOAD_PUBLIC_PATH: /uploads
      APP_JWT_SECRET: docker-compose-demo-secret-at-least-32-chars
    ports:
      - "8080:8080"
    volumes:
      - backend-uploads:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: campus-market-web
    ports:
      - "5173:80"
    depends_on:
      - backend

  admin:
    build:
      context: ./apps/admin
      dockerfile: Dockerfile
    container_name: campus-market-admin
    ports:
      - "5174:80"
    depends_on:
      - backend

volumes:
  mysql-data:
  backend-uploads:
